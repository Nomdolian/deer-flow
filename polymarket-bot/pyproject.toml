[project]
name = "pmbot"
version = "0.1.0"
description = "Polymarket CLOB V2 automated trading bot (maker/arb first, paper by default)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Only needed for mode: live — paper mode, tests and the backtester never
# import the SDK. Pin it: V2 ships breaking changes with short notice.
live = ["py-clob-client-v2==1.1.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[project.scripts]
pmbot = "pmbot.__main__:cli"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["pmbot*"]
