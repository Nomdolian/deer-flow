[project]
name = "trading-system"
version = "0.1.0"
description = "Autonomous multi-asset AI-assisted trading platform (server-hosted, deterministic execution path)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pyotp>=2.9.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
# 5.0.5509 is the oldest release publishing cp312+ wheels (verified against
# PyPI). A looser floor lets a resolver pick an ancient version that has no
# wheel for modern Python and fails with a confusing ABI-tag error.
# Windows-only: every MetaTrader5 wheel is win_amd64, so this extra cannot be
# installed on Linux/macOS — use the [dev] extra there.
mt5 = ["MetaTrader5>=5.0.5509"]
crypto = ["ccxt>=4.4.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[tool.setuptools.packages.find]
# Without this, setuptools' flat-layout auto-discovery sees both app/ and
# mobile/ (a JS/TS project, not a Python package) as top-level candidates and
# refuses to build ("Multiple top-level packages discovered"). Scope it to
# just the actual Python package.
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
